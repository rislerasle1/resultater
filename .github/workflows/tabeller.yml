name: Oppdater tabeller

on:
  schedule:
    - cron: "*/30 * * * *"   # hver halvtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tabeller
  cancel-in-progress: true

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Hent tabellene
        run: node scripts/fetch-standings.mjs

      - name: Commit endringer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/standings.json data/kamper.json data/_debug.json
          git diff --staged --quiet || git commit -m "Oppdaterte tabellene"
          git push
