name: Oppdater EHL-tabell

on:
  schedule:
    - cron: "*/30 * * * *"   # hvert halvtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ehl
  cancel-in-progress: true

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Installer Playwright
        run: |
          npm install playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Hent tabellen
        run: node scripts/fetch-ehl.mjs

      - name: Commit endringer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ehl.json
          git diff --staged --quiet || git commit -m "Oppdaterte EHL-tabellen"
          git push
