<script>
/* ============ OPPSETT ============ */
/* Klokken finnes paa begge sider, saa den settes via klasse, ikke id */
function setAlle(selektor, tekst) {
  document.querySelectorAll(selektor).forEach(el => { el.textContent = tekst; });
}

// Data hentes IKKE direkte fra Google (CORS blokkerer det fra GitHub Pages).
// I stedet henter en GitHub Action CSV-en server-side hvert 15. min og
// lagrer den i repoet på denne relative stien, som denne siden leser
// fra sitt eget opphav (samme domene = ingen CORS-problem).
const CSV_URL = "data/schedule.csv";
const REFRESH_DATA_MS = 5 * 60 * 1000;    // sjekk om filen i repoet er oppdatert hvert 5. min
const REFRESH_CLOCK_MS = 1000;            // klokken (med sekunder) oppdateres hvert sekund

const NB_WEEKDAYS = ["søn","man","tir","ons","tor","fre","lør"];

/* Kioskens åpningstider. Endre disse to linjene ved behov. */
const KIOSK_HOURS_WEEKDAY = { open: "17:00", close: "21:00" }; // man–fre
const KIOSK_HOURS_WEEKEND = { open: "10:00", close: "18:00" }; // lør–søn

/* ============ CSV-PARSER (tåler komma inni anførselstegn) ============ */
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r') { /* ignore */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

/* ============ Hjelpere ============ */
function toMinutes(t) {
  if (!t) return null;
  const m = t.trim().match(/^(\d{1,2}):(\d{2})/);
  if (!m) return null;
  return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
}

function pad(n) { return n < 10 ? "0" + n : "" + n; }

/* Finn dagens rad-etikett, f.eks "man. 7/9", basert på enhetens klokke */
function todayLabel(date) {
  return `${NB_WEEKDAYS[date.getDay()]}. ${date.getDate()}/${date.getMonth() + 1}`;
}

/* Sjekk om en celle i kolonne A markerer en ny dag, f.eks "man. 7/9" eller "lør 12/9" */
function matchesDate(cell, date) {
  if (!cell) return false;
  const c = cell.trim().toLowerCase();
  const wd = NB_WEEKDAYS[date.getDay()];
  const dm = `${date.getDate()}/${date.getMonth() + 1}`;
  // tåler både "man." og "man" og mellomrom-varianter foran dato
  const re = new RegExp(`^${wd}\\.?\\s+${dm}\\b`);
  return re.test(c);
}

function isWeekHeader(cell) {
  return !!cell && /^uke\s+\d+/i.test(cell.trim());
}

/* ============ Kiosk-åpningstider ============ */
function kioskHoursFor(date) {
  const day = date.getDay(); // 0 = søndag, 6 = lørdag
  return (day === 0 || day === 6) ? KIOSK_HOURS_WEEKEND : KIOSK_HOURS_WEEKDAY;
}

function kioskStatus(now) {
  const hours = kioskHoursFor(now);
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const openMin = toMinutes(hours.open);
  const closeMin = toMinutes(hours.close);

  if (nowMin >= openMin && nowMin < closeMin) {
    return { isOpen: true };
  }
  if (nowMin < openMin) {
    return { isOpen: false, nextOpen: hours.open };
  }
  // etter stengetid i dag -> finn neste dags åpningstid
  const tomorrow = new Date(now);
  tomorrow.setDate(tomorrow.getDate() + 1);
  return { isOpen: false, nextOpen: kioskHoursFor(tomorrow).open };
}

/* ============ Hent og tolk data for dagens dato ============ */
async function fetchTodaysSchedule() {
  const bustUrl = CSV_URL + (CSV_URL.includes("?") ? "&" : "?") + "t=" + Date.now();
  const res = await fetch(bustUrl, { cache: "no-store" });
  if (!res.ok) {
    throw new Error(
      "Fant ikke data/schedule.csv (HTTP " + res.status + "). " +
      "Sjekk at GitHub Action-en har kjørt minst én gang (fanen 'Actions' i repoet)."
    );
  }
  const text = await res.text();

  // Google sender HTML-innloggingsside hvis eksporten ikke er tilgjengelig anonymt
  if (/<html/i.test(text.slice(0, 200))) {
    throw new Error("Google-eksporten ba om innlogging da Action-en kjørte. Publiser arket til nett i stedet (se instruksjoner) og bytt URL i workflow-filen.");
  }

  const rows = parseCSV(text);
  const now = new Date();
  const wantedLabel = todayLabel(now);

  let inTodaysBlock = false;
  const slots = [];
  const infoNotes = [];

  for (const row of rows) {
    const colA = (row[0] || "").trim();
    const fra = (row[1] || "").trim();
    const til = (row[2] || "").trim();
    const lag = (row[3] || "").trim();
    const garderobe = (row[5] || "").trim();
    const info = (row[6] || "").trim();

    if (isWeekHeader(colA)) { inTodaysBlock = false; continue; }

    if (colA && matchesDate(colA, now)) {
      inTodaysBlock = true;
    } else if (colA && !matchesDate(colA, now)) {
      // en annen dags rad startet -> vi er ferdig med dagens blokk
      if (inTodaysBlock) break;
      inTodaysBlock = false;
    }

    if (!inTodaysBlock) continue;

    // plukk opp evt. informasjonstekst i kolonne G – kun den FØRSTE for dagen
    if (info && infoNotes.length === 0) infoNotes.push(info);

    // hopp over tomme/ugyldige rader (f.eks. blanke skillelinjer)
    if (!fra && !lag) continue;

    const startMin = toMinutes(fra);
    const endMin = toMinutes(til);
    if (startMin === null) continue; // rad uten gyldig starttid -> ignorer trygt

    slots.push({
      from: fra,
      to: til || "",
      start: startMin,
      end: endMin === null ? startMin + 1 : endMin,
      team: lag || "(ukjent lag)",
      locker: garderobe || "–",
    });
  }

  // sorter alltid på starttid, uansett hvor mange økter det er
  slots.sort((a, b) => a.start - b.start);
  return { slots, wantedLabel, infoNotes };
}

/* ============ Rendering ============ */
let cachedSlots = [];
let cachedInfoNotes = [];
let lastError = null;

function renderEntries(container, list, emptyMsg) {
  container.innerHTML = "";
  if (!list.length) {
    container.innerHTML = `<div class="card-empty">${emptyMsg}</div>`;
    return;
  }
  list.forEach(slot => {
    const div = document.createElement("div");
    div.innerHTML = `
      <div class="entry-time">${slot.from}${slot.to ? " – " + slot.to : ""}</div>
      <div class="entry-team">${slot.team}</div>
      <div class="entry-locker"><span><span class="label">Garderobe</span>${slot.locker}</span></div>
    `;
    container.appendChild(div);
  });
}

function tick() {
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();

  // Klokke og dato øverst til venstre
  setAlle(".clock-time",
    pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds()));
  setAlle(".clock-date",
    now.toLocaleDateString("nb-NO", { weekday: "long", day: "numeric", month: "long" }));

  // Kiosk-status nederst
  const status = kioskStatus(now);
  const statusEl2 = document.getElementById("kioskStatus");
  const kioskBarEl = document.getElementById("kioskBar");
  if (status.isOpen) {
    statusEl2.textContent = "Kiosken er åpen – velkommen opp";
    kioskBarEl.className = "kiosk-bar open";
  } else {
    statusEl2.textContent = "Kiosken åpner klokken " + status.nextOpen;
    kioskBarEl.className = "kiosk-bar closed";
  }

  // Alle økter som pågår nå (kan være flere samtidig, f.eks. delt is)
  const current = cachedSlots.filter(s => nowMin >= s.start && nowMin < s.end);

  // Fyller "PÅ ISEN AKKURAT NÅ"-merket gradvis, fra tidligste start til seneste slutt
  const badgeFill = document.getElementById("badgeFill");
  if (current.length) {
    const blockStart = Math.min(...current.map(s => s.start));
    const blockEnd = Math.max(...current.map(s => s.end));
    const ratio = blockEnd > blockStart
      ? Math.max(0, Math.min(1, (nowMin - blockStart) / (blockEnd - blockStart)))
      : 1;
    badgeFill.style.width = (ratio * 100).toFixed(1) + "%";
  } else {
    badgeFill.style.width = "0%";
  }

  // Neste starttidspunkt, og ALLE lag som starter da (kan være flere)
  const upcomingStarts = cachedSlots.map(s => s.start).filter(t => t > nowMin);
  const nextStart = upcomingStarts.length ? Math.min(...upcomingStarts) : null;
  const next = nextStart === null ? [] : cachedSlots.filter(s => s.start === nextStart);

  const nextCountdownEl = document.getElementById("nextCountdown");
  if (next.length) {
    const minsLeft = Math.max(0, nextStart - nowMin);
    nextCountdownEl.textContent = "Økten starter om " + minsLeft + " min";
  } else {
    nextCountdownEl.textContent = "";
  }

  renderEntries(document.getElementById("nowEntries"), current, "Ingen på isen akkurat nå");
  renderEntries(document.getElementById("nextEntries"), next, "Ingen flere økter i dag");

  const statusEl = document.getElementById("statusMsg");
  if (lastError) {
    statusEl.textContent = "⚠ " + lastError;
    statusEl.className = "status-msg error";
  } else {
    statusEl.textContent = "Sist oppdatert " + pad(now.getHours()) + ":" + pad(now.getMinutes());
    statusEl.className = "status-msg";
  }
}

async function refreshData() {
  try {
    const { slots, infoNotes } = await fetchTodaysSchedule();
    cachedSlots = slots;
    cachedInfoNotes = infoNotes;
    lastError = null;
  } catch (e) {
    lastError = e.message || String(e);
    // behold forrige gyldige data i tilfelle midlertidig nettverksfeil
  }
  tick();
}

refreshData();
setInterval(refreshData, REFRESH_DATA_MS);
setInterval(tick, REFRESH_CLOCK_MS);


/* ============ TABELLER SOM ROTERER ============
   Kilde: TurneringsAdmin, via scripts/fetch-standings.mjs.
   Nettleseren faar ikke kalle API-et direkte (CORS), saa en GitHub Action
   henter dataene og skriver data/standings.json inn i repoet.
*/
const TABELL_URL = "data/standings.json";
const TABELL_FALLBACK = "data/ehl.json";   // fra foer flertabell-versjonen
const TABELL_REFRESH_MS = 15 * 60 * 1000;
const TABELL_BYTTE_MS = 7000;

/* Marker klubbens egne lag */
const CLUB_PATTERN = /hasle\s*[-/ ]?\s*l(ø|o)ren/i;

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function monogram(navn) {
  return (navn || "")
    .replace(/[^\wæøåÆØÅ\s]/g, " ")
    .split(/\s+/).filter(Boolean)
    .slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
}

/* Taaler bade gp/pts/gf/ga og kamper/poeng/mal */
function normalizeRow(r, i) {
  let gf = r.gf, ga = r.ga;
  if ((gf == null || ga == null) && typeof r.mal === "string") {
    const m = r.mal.match(/(\d+)\s*[-:]\s*(\d+)/);
    if (m) { gf = +m[1]; ga = +m[2]; }
  }
  return {
    plass: r.plass ?? r.pos ?? i + 1,
    lag: r.lag ?? r.team ?? r.navn ?? "",
    logo: r.logo || "",
    gp: r.gp ?? r.kamper ?? null,
    pts: r.pts ?? r.poeng ?? null,
    gf: gf ?? null,
    ga: ga ?? null
  };
}

let tabeller = [];
let tabellIndex = 0;
let byttTimer = null;

function tegnRader(tabell) {
  return (tabell.lag || []).map(normalizeRow).map(r => `
    <tr class="${CLUB_PATTERN.test(r.lag) ? "club" : ""}">
      <td class="logo-cell">${
        r.logo
          ? `<img class="club-logo" src="${escapeHtml(r.logo)}" alt="">`
          : `<span class="club-monogram">${escapeHtml(monogram(r.lag))}</span>`
      }</td>
      <td class="team-col"><span class="table-pos">${r.plass}</span>${escapeHtml(r.lag)}</td>
      <td>${r.gp ?? "–"}</td>
      <td class="pts">${r.pts ?? "–"}</td>
      <td>${r.gf ?? "–"}</td>
      <td>${r.ga ?? "–"}</td>
    </tr>`).join("");
}

function tegnPrikker() {
  document.getElementById("tabellDots").innerHTML =
    tabeller.length > 1
      ? tabeller.map((_, n) => `<span class="${n === tabellIndex ? "on" : ""}"></span>`).join("")
      : "";
}

function visTabell(n, mykt = true) {
  const tabell = tabeller[n];
  if (!tabell) return;
  const wrap = document.getElementById("tabellWrap");

  const bytt = () => {
    document.getElementById("tabellTittel").textContent = tabell.navn || "Tabell";
    document.getElementById("tabellBody").innerHTML = tegnRader(tabell);
    wrap.scrollTop = 0;
    tegnPrikker();
    wrap.style.opacity = 1;
  };

  if (!mykt) { bytt(); return; }
  wrap.style.opacity = 0;
  setTimeout(bytt, 350);
}

function visFeil(melding) {
  document.getElementById("tabellBody").innerHTML =
    `<tr><td colspan="6" style="text-align:center;color:#4a6a86;font-weight:600;">${escapeHtml(melding)}</td></tr>`;
}

function startRotasjon() {
  clearInterval(byttTimer);
  if (tabeller.length < 2) return;
  byttTimer = setInterval(() => {
    tabellIndex = (tabellIndex + 1) % tabeller.length;
    visTabell(tabellIndex);
  }, TABELL_BYTTE_MS);
}

async function hentTabeller() {
  // Prøv flertabell-fila først, fall tilbake paa den gamle EHL-fila
  for (const url of [TABELL_URL, TABELL_FALLBACK]) {
    try {
      const res = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) continue;
      const data = await res.json();
      const nye = (data.tabeller || [data]).filter(t => (t.lag || []).length);
      if (nye.length) return nye;
    } catch { /* prøv neste */ }
  }
  return null;
}

async function refreshTabeller() {
  const nye = await hentTabeller();

  if (!nye) {
    // Behold forrige gyldige tabell hvis nettverket svikter
    if (!tabeller.length) visFeil("Fikk ikke hentet tabellene");
    return;
  }

  tabeller = nye;
  if (tabellIndex >= tabeller.length) tabellIndex = 0;
  visTabell(tabellIndex, false);
  startRotasjon();
}

refreshTabeller();
setInterval(refreshTabeller, TABELL_REFRESH_MS);

/* ============ SIDE 2: KAMPER ============
   data/kamper.json skrives av scripts/fetch-standings.mjs.
   Bare kamper der Hasle/Løren, Hasle/Løren 2 eller Hasle/Løren Elite deltar.
*/
const KAMP_URL = "data/kamper.json";
const KAMP_REFRESH_MS = 15 * 60 * 1000;

function kampDato(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ""));
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}

/* Alt vises fra Hasle/Løren sitt staasted: motstander, ikke begge lagene. */
function kampSett(k) {
  const vaartHjemme = CLUB_PATTERN.test(k.hjemme);
  const vaartBorte = CLUB_PATTERN.test(k.borte);
  const hjemme = vaartHjemme;                  // intern kamp: hjemmelaget regnes som vaart
  return {
    hjemme,
    intern: vaartHjemme && vaartBorte,
    vaartLag: hjemme ? k.hjemme : k.borte,
    motstander: hjemme ? k.borte : k.hjemme,
    vaareMal: hjemme ? k.hjemmeMal : k.borteMal,
    motMal: hjemme ? k.borteMal : k.hjemmeMal
  };
}

function datoBoks(k, medTid) {
  const d = kampDato(k.dato);
  return `
    <div class="kamp-dato">
      ${d ? `${NB_WEEKDAYS[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}.` : ""}
      ${medTid ? `<small>${escapeHtml(k.tid || "")}</small>` : ""}
    </div>`;
}

/* Spilt kamp: motstander, serie og resultat */
function tegnSpilt(k) {
  const v = kampSett(k);
  let utfall = "";
  if (v.vaareMal != null && v.motMal != null && !v.intern) {
    if (v.vaareMal > v.motMal) utfall = "seier";
    else if (v.vaareMal < v.motMal) utfall = "tap";
  }
  return `
    <div class="kamp ${v.hjemme ? "hjemme" : ""}">
      ${datoBoks(k, false)}
      <div class="kamp-lag">
        ${escapeHtml(v.motstander)}
        <div class="kamp-meta">${escapeHtml([v.vaartLag, k.divisjon].filter(Boolean).join(" · "))}</div>
      </div>
      <div class="kamp-res ${utfall}">${
        v.vaareMal != null ? `${v.vaareMal}–${v.motMal}` : "–"
      }</div>
    </div>`;
}

/* Kommende kamp: motstander, hjemme eller borte, sted, dato og klokkeslett */
function tegnKommende(k) {
  const v = kampSett(k);
  return `
    <div class="kamp ${v.hjemme ? "hjemme" : ""}">
      ${datoBoks(k, true)}
      <div class="kamp-lag">
        ${escapeHtml(v.motstander)}
        <div class="kamp-meta">${escapeHtml([v.vaartLag, k.arena].filter(Boolean).join(" · "))}</div>
      </div>
      <div class="kamp-hb ${v.hjemme ? "h" : "b"}">${v.hjemme ? "Hjemme" : "Borte"}</div>
    </div>`;
}

function tomListe(tekst) {
  return `<div class="kamp-tom">${escapeHtml(tekst)}</div>`;
}

let kampData = null;

function tegnKamper() {
  const kamper = kampData?.kamper || [];
  const iDag = new Date(); iDag.setHours(0, 0, 0, 0);
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  const fra = new Date(iDag); fra.setDate(fra.getDate() - 7);
  const til = new Date(iDag); til.setDate(til.getDate() + 7);

  const spilt = kamper
    .filter(k => k.dato >= iso(fra) && k.dato <= iso(iDag) && k.hjemmeMal != null)
    .sort((a, b) => b.dato.localeCompare(a.dato));

  const kommende = kamper
    .filter(k => k.dato >= iso(iDag) && k.dato <= iso(til) && k.hjemmeMal == null)
    .sort((a, b) => a.dato.localeCompare(b.dato) || (a.tid || "").localeCompare(b.tid || ""));

  document.getElementById("antallSpilt").textContent = spilt.length || "";
  document.getElementById("antallKommende").textContent = kommende.length || "";

  document.getElementById("kamperSpilt").innerHTML =
    spilt.length ? spilt.map(tegnSpilt).join("") : tomListe("Ingen spilte kamper");
  document.getElementById("kamperKommende").innerHTML =
    kommende.length ? kommende.map(tegnKommende).join("") : tomListe("Ingen kamper satt opp");

  document.getElementById("kampKilde").textContent =
    "Kilde: hockey.no" + (kampData?.oppdatert ? " · oppdatert " + kampData.oppdatert : "");
}

async function refreshKamper() {
  try {
    const res = await fetch(KAMP_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    kampData = await res.json();
  } catch {
    // Behold forrige gyldige data
    if (!kampData) kampData = { kamper: [] };
  }
  tegnKamper();
}

refreshKamper();
setInterval(refreshKamper, KAMP_REFRESH_MS);


/* ============ VEKSLING MELLOM SIDENE ============
   Side 1 vises saa lenge det tar aa gaa gjennom alle tabellene en gang.
   Side 2 staar i 20 sekunder.
*/
const KAMPSIDE_MS = 20000;
let sideIndex = 0;
let sideTimer = null;

function varighetSide1() {
  return Math.max(1, tabeller.length) * TABELL_BYTTE_MS;
}

function visSide(n) {
  sideIndex = n;
  const paaSide1 = n === 0;

  document.getElementById("slideSchedule").classList.toggle("active", paaSide1);
  document.getElementById("slideKamper").classList.toggle("active", !paaSide1);

  if (paaSide1) {
    // Start tabellrunden forfra hver gang side 1 kommer opp
    tabellIndex = 0;
    visTabell(0, false);
    startRotasjon();
  } else {
    clearInterval(byttTimer);
  }

  clearTimeout(sideTimer);
  sideTimer = setTimeout(() => visSide(paaSide1 ? 1 : 0),
                         paaSide1 ? varighetSide1() : KAMPSIDE_MS);
}

visSide(0);

</script>
