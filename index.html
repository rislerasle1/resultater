<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultatbank – Hasle/Løren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ice: #f4f8fb;
    --deep: #0d3b66;
    --deep-2: #17518c;
    --red: #c0392b;
    --red-dark: #6e1f18;
    --text: #12212e;
    --muted: #7d94a8;
    --line: #dbe5ee;
    --line-soft: #edf2f7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #0a1622;
    font-family: "Public Sans", system-ui, sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  body { display: flex; align-items: center; justify-content: center; }

  .stage {
    width: 100vw; height: 56.25vw;
    max-height: 100vh; max-width: 177.78vh;
    position: relative; overflow: hidden;
    background: var(--ice);
  }

  .page {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .page.on { opacity: 1; pointer-events: auto; }

  /* ---------- Topp ---------- */
  header {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.1vw 2vw;
    background: var(--deep);
    border-bottom: 0.25vw solid var(--red);
  }
  .clock { color: white; line-height: 1; }
  .clock-time { font-size: 2vw; font-weight: 900; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .clock-date { font-size: 0.8vw; font-weight: 600; color: #9dc0dd; margin-top: 0.25vw; text-transform: capitalize; }

  .title { text-align: center; }
  .title .kicker {
    font-size: 0.75vw; font-weight: 800; letter-spacing: 0.22em;
    text-transform: uppercase; color: #7fb0dc;
  }
  .title h1 {
    font-size: 1.9vw; font-weight: 900; color: white;
    letter-spacing: -0.01em; margin-top: 0.2vw;
  }

  .brand { display: flex; align-items: center; gap: 0.8vw; }
  .brand img { height: 3.4vw; display: block; }

  /* ---------- Innhold ---------- */
  .body {
    flex: 1; min-height: 0;
    display: flex; gap: 0.15vw;
    background: var(--line);
    border-bottom: 0.15vw solid var(--line);
  }

  .panel { background: white; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .panel.tabell { width: 46%; }
  .panel.kamper { flex: 1; }

  .panel-head {
    flex-shrink: 0;
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 0.6vw 1.1vw;
    background: #eef4f9;
    border-bottom: 1px solid var(--line);
    font-size: 0.78vw; font-weight: 900;

  }
  .panel-head .note {
    font-size: 0.7vw; font-weight: 700; color: var(--muted);
    letter-spacing: 0; text-transform: none;
  }
  .panel-body { flex: 1; min-height: 0; overflow: hidden; }

  /* ---------- Tabell ----------
     --rh (radhoeyde) settes av tilpass() slik at tabellen fyller panelet,
     og all tekst i tabellen skalerer med den. */
  .panel.tabell { --rh: 2.4vw; }
  table { width: 100%; border-collapse: collapse; }
  th {
    font-size: 0.75vw; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;

    border-bottom: 1px solid var(--line);

  th.lag { text-align: left; }
  td {
    height: var(--rh);
    font-size: calc(var(--rh) * 0.42); font-weight: 700; text-align: right;
    padding: 0 0.9vw; border-bottom: 1px solid var(--line-soft);
    font-variant-numeric: tabular-nums;

  td.pos { width: calc(var(--rh) * 1.15); text-align: center; padding: 0 0.3vw 0 0.9vw; }

  td.crest { width: calc(var(--rh) * 1.1); text-align: center; padding: 0 0.2vw; }

  /* ---------- Neste kamp (fremhevet) ---------- */
  .neste {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 1.4vw;
    padding: 1.1vw 1.4vw;
    background: var(--deep); color: white;
  }
  .neste.hjemme { background: linear-gradient(90deg, var(--deep) 0%, var(--deep-2) 100%); }
  .neste .nk-dato {
    flex-shrink: 0; width: 6.4vw; text-align: center;

  .neste .nk-dag { font-size: 0.8vw; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--red); }
  .neste .nk-dm { font-size: 1.9vw; font-weight: 900; font-variant-numeric: tabular-nums; }
  .neste .nk-tid { font-size: 0.95vw; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--deep-2); }
  .neste .nk-info { flex: 1; min-width: 0; }
  .neste .nk-k {

  .kamp .mot {

  .kamp .res {

  .kamp .res.s { background: #157a4c; color: white; }

  .hb {
    flex-shrink: 0; font-size: 0.72vw; font-weight: 900;

  .hb.h { background: var(--deep); color: white; }

  /* Ligaresultater er noeytrale: vinneren uthevet, ingen seier/tap-farge */
  .kamp.liga .mot { flex: 1; font-weight: 600; color: #4a6075; }

  .kol { display: flex; flex-direction: column; min-height: 0; height: 100%; }

  /* ---------- Isstripe nederst ---------- */
  .ice {

  .ice-now .k {

</style></head>
<body>

<div class="stage" id="stage">
  <div class="laster" id="laster">Laster …</div>
</div>

<script>
/* =========================================================================
   Resultatbank – Hasle/Løren
   Infoskjerm for Løren ishall.

   Leser fire filer fra repoet. Nettleseren snakker aldri med hockey.no
   direkte - GitHub Actions henter dataene og skriver dem hit.

     data/tabeller.json   hvilke sider som vises, og i hvilken rekkefoelge
     data/standings.json  tabellene
     data/kamper.json     kamper og resultater
     data/schedule.csv    dagens istider, fra Google-arket

   Legge til et lag: registrer serien i data/tabeller.json. Ingen kodeendring.
   ========================================================================= */

const LOGO = "https://cdn-bloc.no/background/200000195/7987/2026/4/23/hl_logo.png";

const SIDE_MS = 10000;               // hvor lenge hver lagside staar

/* Fullskjermbanner. Raa-adressen, ikke github.com/.../blob/... - den siste
   er en nettside, ikke et bilde. Best: kopier bildet inn i dette repoet og
   sett BANNER til "bilder/banner.png", saa er du ikke avhengig av et annet repo. */
const BANNER = "https://raw.githubusercontent.com/rislerasle1/iceice/main/banner%20sk%C3%B8yte%20og%20hockeyskolen.png";
const BANNER_MS = 5000;              // hvor lenge banneret staar
const BANNER_ETTER = [1, 4];         // vises etter disse sidene, nullbasert
const DATA_REFRESH_MS = 15 * 60 * 1000;
const IS_REFRESH_MS = 5 * 60 * 1000;

const MAX_SPILTE = 8;                // hoeyst saa mange rader per panel,
const MAX_KOMMENDE = 12;             // tilpass() kutter til det som faar plass
const MAX_LIGA = 12;

/* Alle skrivemaatene klubben opptrer med paa hockey.no */
const OSS = /hasle\s*[-/ ]?\s*l(ø|o)ren/i;

/* ---------- Smaating ---------- */
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const NB = ["søn", "man", "tir", "ons", "tor", "fre", "lør"];

function datoTekst(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ""));
  if (!m) return "";
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return `${NB[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}.`;
}

/* hockey.no bruker de formelle navnene:
   "Tønsberg og Omegn Ishockeyklubb - MEN 1" -> "Tønsberg og Omegn" */
function kortNavn(n) {
  let s = String(n || "").trim();
  s = s.replace(/\s*-\s*(MEN|WOMEN|WOM|U\s*-?\d+|JU\s*-?\d+|J\s*-?\d+)\s*\d*\s*$/i, "");
  s = s.split(" - ")[0];
  s = s.replace(/\s+Elite\s*$/i, "");
  s = s.replace(/,?\s*\b(Ishockeygruppen|Ishockeyklubben|Ishockeyklubb|Issportklubb|Idrettsforeningen|Idrettsforening|Idrettslaget|Idrettslag|Sportsklubb|Turn og Idrettsforening|Ishockey|Hockey|IHK|AIL|IL|IF)\b/gi, " ");
  s = s.replace(/\s{2,}/g, " ").replace(/\s*,\s*$/, "").trim() || String(n || "");
  // Klubben skrives snart med bindestrek, snart med skraastrek. Vi velger en.
  return s.replace(/hasle\s*[-/ ]\s*l(ø|o)ren/i, "Hasle/Løren");
}

function monogram(n) {
  return (n || "").replace(/[^\wæøåÆØÅ\s]/g, " ").split(/\s+/).filter(Boolean)
    .slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
}

function minutter(t) {
  const m = String(t || "").trim().match(/^(\d{1,2}):(\d{2})/);
  return m ? +m[1] * 60 + +m[2] : null;
}

/* ---------- Henting ---------- */
let sider = [];        // fra tabeller.json
let standings = null;
let kamper = [];
let oekter = [];       // dagens istider
let feilmelding = "";

async function json(url) {
  const res = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error(url + ": HTTP " + res.status);
  return res.json();
}

async function hentData() {
  try {
    const konf = await json("data/tabeller.json");
    sider = (konf.tabeller || []).filter(t => t.tournamentId);
  } catch (e) {
    feilmelding = "Fant ikke data/tabeller.json";
  }

  try {
    standings = await json("data/standings.json");
  } catch (e) {
    if (!standings) feilmelding = "Fant ikke data/standings.json";
  }

  try {
    kamper = (await json("data/kamper.json")).kamper || [];
  } catch (e) {
    /* behold forrige sett */
  }
}

/* ---------- Istider fra Google-arket ---------- */
function parseCSV(text) {
  const rows = []; let row = [], felt = "", iQuote = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (iQuote) {
      if (c === '"') { if (text[i + 1] === '"') { felt += '"'; i++; } else iQuote = false; }
      else felt += c;
    } else if (c === '"') iQuote = true;
    else if (c === ",") { row.push(felt); felt = ""; }
    else if (c === "\n") { row.push(felt); rows.push(row); row = []; felt = ""; }
    else if (c !== "\r") felt += c;
  }
  if (felt.length || row.length) { row.push(felt); rows.push(row); }
  return rows;
}

async function hentIstider() {
  try {
    const res = await fetch("data/schedule.csv?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const tekst = await res.text();
    if (/<html/i.test(tekst.slice(0, 200))) throw new Error("innlogging");

    const naa = new Date();
    const ukedag = NB[naa.getDay()];
    const dm = `${naa.getDate()}/${naa.getMonth() + 1}`;
    const erIdag = c => new RegExp(`^${ukedag}\\.?\\s+${dm}\\b`).test((c || "").trim().toLowerCase());

    let inne = false;
    const ut = [];
    for (const row of parseCSV(tekst)) {
      const a = (row[0] || "").trim();
      if (/^uke\s+\d+/i.test(a)) { inne = false; continue; }
      if (a) {
        if (erIdag(a)) inne = true;
        else if (inne) break;
        else inne = false;
      }
      if (!inne) continue;

      const start = minutter(row[1]);
      if (start === null) continue;
      const slutt = minutter(row[2]);
      ut.push({
        fra: (row[1] || "").trim(),
        til: (row[2] || "").trim(),
        start,
        slutt: slutt === null ? start + 60 : slutt,
        lag: (row[3] || "").trim() || "Trening"
      });
    }
    oekter = ut.sort((a, b) => a.start - b.start);
  } catch (e) {
    /* behold forrige sett */
  }
}

/* ---------- Bygg innhold ---------- */
function tabellHtml(tabell) {
  const rader = tabell?.lag || [];
  if (!rader.length) return `<div class="tomt">Ingen tabell</div>`;

  return `<table>
    <thead><tr>
      <th></th><th></th><th class="lag">Lag</th><th>GP</th><th>+/−</th><th>PTS</th>
    </tr></thead>
    <tbody>${rader.map((r, i) => {
      const navn = kortNavn(r.lag);
      const oss = OSS.test(r.lag);
      // Hasle-Løren har ingen logo registrert i NIF - bruk vaar egen
      const logo = r.logo || (oss ? LOGO : "");
      const diff = r.diff ?? (r.gf != null && r.ga != null ? r.gf - r.ga : null);
      const diffTekst = diff == null ? "–" : diff > 0 ? `+${diff}` : String(diff).replace("-", "−");
      return `<tr class="${oss ? "oss" : ""}">
        <td class="pos"><b>${r.plass ?? i + 1}</b></td>
        <td class="crest">${logo
          ? `<img src="${esc(logo)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${esc(monogram(navn))}'}))">`
          : `<span>${esc(monogram(navn))}</span>`}</td>
        <td class="lag">${esc(navn)}</td>
        <td>${r.gp ?? "–"}</td><td>${diffTekst}</td><td class="pts">${r.pts ?? "–"}</td>
      </tr>`;
    }).join("")}</tbody>
  </table>`;
}

/* Kampen sett fra vaart staasted */
function sett(k) {
  const hjemme = OSS.test(k.hjemme);
  return {
    hjemme,
    motstander: kortNavn(hjemme ? k.borte : k.hjemme),
    vaare: hjemme ? k.hjemmeMal : k.borteMal,
    deres: hjemme ? k.borteMal : k.hjemmeMal
  };
}

/* Stort kort med neste kamp - det folk i hallen oftest lurer paa */
function nesteHtml(k) {
  const v = sett(k);
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(k.dato || "");
  const d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  const idag = iso(new Date()) === k.dato;
  const tid = k.tid && k.tid !== "00:00" ? k.tid : "";
  return `<div class="neste ${v.hjemme ? "hjemme" : ""}">
    <div class="nk-dato">
      <div class="nk-dag">${idag ? "I dag" : d ? NB[d.getDay()] : ""}</div>
      <div class="nk-dm">${d ? `${d.getDate()}.${d.getMonth() + 1}.` : ""}</div>
      ${tid ? `<div class="nk-tid">${esc(tid)}</div>` : ""}
    </div>
    <div class="nk-info">
      <div class="nk-k">Neste kamp</div>
      <div class="nk-mot">${v.hjemme ? "mot " : "borte mot "}${esc(v.motstander)}</div>
      ${k.arena ? `<div class="nk-sted">${esc(k.arena)}</div>` : ""}
    </div>
    <div class="hb ${v.hjemme ? "h" : "b"}">${v.hjemme ? "Hjemme" : "Borte"}</div>
  </div>`;
}

function spilteHtml(liste) {
  if (!liste.length) return `<div class="tomt">Ingen spilte kamper</div>`;
  return liste.map(k => {
    const v = sett(k);
    const u = v.vaare > v.deres ? "s" : v.vaare < v.deres ? "t" : "";
    return `<div class="kamp ${v.hjemme ? "hjemme" : ""}">
      <div class="dato">${esc(datoTekst(k.dato))}</div>
      <div class="mot">${esc(v.motstander)}<small>${v.hjemme ? "Hjemme" : "Borte"}${k.arena ? " · " + esc(k.arena) : ""}</small></div>
      <div class="res ${u}">${v.vaare}–${v.deres}</div>
    </div>`;
  }).join("");
}

function kommendeHtml(liste) {
  if (!liste.length) return `<div class="tomt">Ingen flere kamper satt opp</div>`;
  return liste.map(k => {
    const v = sett(k);
    const tid = k.tid && k.tid !== "00:00" ? k.tid : "";
    return `<div class="kamp ${v.hjemme ? "hjemme" : ""}">
      <div class="dato">${esc(datoTekst(k.dato))}${tid ? `<small>${esc(tid)}</small>` : ""}</div>
      <div class="mot">${esc(v.motstander)}<small>${esc(k.arena || k.divisjon || "")}</small></div>
      <div class="hb ${v.hjemme ? "h" : "b"}">${v.hjemme ? "Hjemme" : "Borte"}</div>
    </div>`;
  }).join("");
}

/* Noeytral resultatliste for hele ligaen */
function ligaHtml(liste) {
  if (!liste.length) return `<div class="tomt">Ingen resultater</div>`;
  return liste.map(k => `
    <div class="kamp liga">
      <div class="dato">${esc(datoTekst(k.dato))}</div>
      <div class="mot hj ${k.hjemmeMal > k.borteMal ? "vinner" : ""}">${esc(kortNavn(k.hjemme))}</div>
      <div class="res">${k.hjemmeMal}–${k.borteMal}</div>
      <div class="mot bo ${k.borteMal > k.hjemmeMal ? "vinner" : ""}">${esc(kortNavn(k.borte))}</div>
    </div>`).join("");
}

function sideHtml(def, tabell, n, antall) {
  const idag = iso(new Date());
  const iSerien = kamper.filter(k => k.divisjon === def.navn);
  const spilte = iSerien.filter(k => k.hjemmeMal != null)
    .sort((a, b) => b.dato.localeCompare(a.dato));
  const kommende = iSerien.filter(k => k.hjemmeMal == null && k.dato >= idag)
    .sort((a, b) => a.dato.localeCompare(b.dato) || (a.tid || "").localeCompare(b.tid || ""));

  const tittel = def.type === "liga"
    ? esc(def.navn)
    : `Hasle/Løren ${esc(def.lag || "")} · ${esc(def.navn)}`;

  /* Hoeyre side tilpasser seg sesongen: foer seriestart er det ingen spilte
     kamper, og da faar "Senere kamper" hele hoeyden i stedet for en tom halvdel.
     Listene kuttes til det som faktisk faar plass, se tilpass(). */
  const [neste, ...senere] = kommende;
  const hoeyre = def.type === "liga"
    ? `<div class="panel-head">Siste resultater <span class="note">${spilte.length || ""}</span></div>
       <div class="panel-body" data-fyll>${ligaHtml(spilte.slice(0, MAX_LIGA))}</div>`
    : `<div class="kol">
         ${neste ? nesteHtml(neste) : ""}
         ${spilte.length ? `<div class="halv">
           <div class="panel-head">Siste resultater <span class="note">${spilte.length} spilt</span></div>
           <div class="panel-body" data-fyll>${spilteHtml(spilte.slice(0, MAX_SPILTE))}</div>
         </div>` : ""}
         ${senere.length || !spilte.length ? `<div class="halv">
           <div class="panel-head">Senere kamper <span class="note">${senere.length ? senere.length + " igjen" : ""}</span></div>
           <div class="panel-body" data-fyll>${kommendeHtml(senere.slice(0, MAX_KOMMENDE))}</div>
         </div>` : ""}
       </div>`;

  return `
    <header>
      <div class="clock">
        <div class="clock-time" data-tid>–</div>
        <div class="clock-date" data-dato>–</div>
      </div>
      <div class="title">
        <div class="kicker">RESULTATBØRS</div>
        <h1>${tittel}</h1>
      </div>
      <div class="brand">
        <div class="dots">${Array.from({ length: antall }, (_, i) =>
          `<i class="${i === n ? "on" : ""}"></i>`).join("")}</div>
        <img src="${LOGO}" alt="Hasle/Løren">
      </div>
    </header>

    <div class="body">
      <div class="panel tabell">
        <div class="panel-head">Tabell <span class="note">${standings?.oppdatert ? "Oppdatert " + esc(standings.oppdatert) : ""}</span></div>
        <div class="panel-body" data-tabell>${tabellHtml(tabell)}</div>
      </div>
      <div class="panel kamper">${hoeyre}</div>
    </div>

    <div class="ice" data-ice>
      <div class="ice-fill" data-fill style="width:0%"></div>
      <div class="ice-row">
        <div class="ice-now">
          <div class="k">På isen nå</div>
          <div class="lag" data-naa>–</div>
        </div>
        <div class="ice-mid" data-midt></div>
        <div class="ice-next">
          <div class="k">Neste ut</div>
          <div class="lag" data-neste>–</div>
        </div>
      </div>
    </div>`;
}

/* ---------- Sidene ---------- */
const stage = document.getElementById("stage");
let sideIndex = 0;
let sideTimer = null;

function bygg() {
  const tabeller = standings?.tabeller || [];
  const aktuelle = sider.filter(def =>
    tabeller.some(t => t.navn === def.navn) || kamper.some(k => k.divisjon === def.navn));

  stage.querySelectorAll(".page").forEach(el => el.remove());

  if (!aktuelle.length) {
    document.getElementById("laster").textContent =
      feilmelding || "Ingen data ennå – kjør workflowen «Oppdater tabeller»";
    document.getElementById("laster").style.display = "flex";
    return;
  }
  document.getElementById("laster").style.display = "none";

  const leggTilBanner = () => {
    if (!BANNER) return;
    const el = document.createElement("div");
    el.className = "page banner";
    el.dataset.ms = BANNER_MS;
    const img = document.createElement("img");
    img.alt = "";
    // Naar bildet ikke lar seg laste, hoppes siden over i stedet for
    // aa staa svart i fem sekunder
    img.onerror = () => { el.dataset.hopp = "1"; };
    img.src = BANNER;
    el.appendChild(img);
    stage.appendChild(el);
  };

  aktuelle.forEach((def, n) => {
    const tabell = tabeller.find(t => t.navn === def.navn);
    const el = document.createElement("div");
    el.className = "page";
    el.innerHTML = sideHtml(def, tabell, n, aktuelle.length);
    stage.appendChild(el);
    if (BANNER_ETTER.includes(n)) leggTilBanner();
  });

  tilpass();
  if (sideIndex >= aktuelle.length) sideIndex = 0;
  visSide(sideIndex);
  tikk();
}

/* Tabellen strekkes til aa fylle panelet (store rader naar det er faa lag),
   og kamplistene kuttes til hele rader i stedet for aa bli klippet nederst. */
function tilpass() {
  const vw = stage.clientWidth / 100;
  stage.querySelectorAll("[data-tabell]").forEach(body => {
    const panel = body.closest(".panel");
    const rader = body.querySelectorAll("tbody tr").length;
    if (!rader) return;
    const thead = body.querySelector("thead")?.offsetHeight || 0;
    const rh = (body.clientHeight - thead - 2) / rader;
    panel.style.setProperty("--rh", Math.max(1.5 * vw, Math.min(3.6 * vw, rh)) + "px");
  });
  stage.querySelectorAll("[data-fyll]").forEach(body => {
    const rader = body.querySelectorAll(".kamp");
    for (let i = rader.length - 1; i > 0 && body.scrollHeight > body.clientHeight; i--) {
      rader[i].remove();
    }
  });
}

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(bygg, 300);
});

function visSide(n) {
  const alle = stage.querySelectorAll(".page");
  if (!alle.length) return;

  // Hopp over sider som har meldt seg ut, f.eks. et banner som ikke lastet
  let i = n % alle.length;
  for (let forsoek = 0; forsoek < alle.length && alle[i].dataset.hopp; forsoek++) {
    i = (i + 1) % alle.length;
  }

  sideIndex = i;
  alle.forEach((el, k) => el.classList.toggle("on", k === sideIndex));

  clearTimeout(sideTimer);
  sideTimer = setTimeout(() => visSide(sideIndex + 1),
                         +alle[sideIndex].dataset.ms || SIDE_MS);
}

/* ---------- Klokke og isstripe ---------- */
function tikk() {
  const n = new Date();
  const tid = `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
  const dato = n.toLocaleDateString("nb-NO", { weekday: "long", day: "numeric", month: "long" });
  const sett = (sel, v) => stage.querySelectorAll(sel).forEach(e => e.textContent = v);

  sett("[data-tid]", tid);
  sett("[data-dato]", dato);

  const naaMin = n.getHours() * 60 + n.getMinutes() + n.getSeconds() / 60;
  const paa = oekter.filter(o => naaMin >= o.start && naaMin < o.slutt);
  const senere = oekter.filter(o => o.start > naaMin);
  const neste = senere.length ? senere[0] : null;

  const tom = !paa.length;
  stage.querySelectorAll("[data-ice]").forEach(e => e.classList.toggle("tom", tom));

  if (paa.length) {
    const a = Math.min(...paa.map(o => o.start));
    const b = Math.max(...paa.map(o => o.slutt));
    const andel = b > a ? Math.min(1, Math.max(0, (naaMin - a) / (b - a))) : 1;
    const igjen = Math.max(0, Math.round(b - naaMin));

    stage.querySelectorAll("[data-fill]").forEach(e => e.style.width = (andel * 100).toFixed(2) + "%");
    sett("[data-naa]", paa.map(o => o.lag).join(" + "));
    sett("[data-midt]", `${paa[0].fra}–${paa[0].til}   ·   ${igjen} min igjen`);
  } else {
    stage.querySelectorAll("[data-fill]").forEach(e => e.style.width = "0%");
    sett("[data-naa]", oekter.length ? "Isen er ledig" : "Ingen istider i dag");
    sett("[data-midt]", "");
  }

  sett("[data-neste]", neste ? `${neste.lag} · ${neste.fra}` : "—");
}

/* ---------- Oppstart ---------- */
async function start() {
  await Promise.all([hentData(), hentIstider()]);
  bygg();
  // Fonten endrer radhoeydene naar den er lastet - mal opp paa nytt
  document.fonts?.ready.then(bygg);

  setInterval(async () => { await hentData(); bygg(); }, DATA_REFRESH_MS);
  setInterval(hentIstider, IS_REFRESH_MS);
  setInterval(tikk, 1000);
}

start();
</script>
